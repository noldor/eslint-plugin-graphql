name: Quality and release

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9.-]*\))?!?: \S.*', os.environ['PR_TITLE']):
              raise SystemExit('Use a Conventional Commit PR title')
          PY

  test:
    name: Node ${{ matrix.node }} / ESLint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
        eslint: [9, 10]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts eslint@${{ matrix.eslint }}
      - run: npm run check

  quality:
    name: Quality
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  release:
    name: Release
    needs: quality
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - name: Check exact release revision
        run: test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"
      - name: Find an existing tag for this checked revision
        id: version
        run: |
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' | sort -V | tail -n 1)
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          if ! git tag --list 'v[0-9]*' | grep -q .; then
            echo 'initial=0.0.1' >> "$GITHUB_OUTPUT"
          fi
      - name: Create immutable SemVer tag
        id: tag
        if: steps.version.outputs.existing == ''
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ github.sha }}
          release_branches: ^master$
          tag_prefix: v
          custom_tag: ${{ steps.version.outputs.initial }}
          default_bump: patch
          commit_analyzer_preset: conventionalcommits
          force_update: false
      - name: Publish and verify the checked revision
        env:
          RELEASE_TAG: ${{ steps.version.outputs.existing || steps.tag.outputs.new_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"
          version=${RELEASE_TAG#v}
          npm version "$version" --no-git-tag-version --allow-same-version
          published=$(npm view "@noldor/eslint-plugin-graphql@$version" gitHead 2>/dev/null || true)
          if [ -z "$published" ]; then
            npm publish --access public --provenance
          fi
          for attempt in $(seq 1 30); do
            if published=$(npm view "@noldor/eslint-plugin-graphql@$version" gitHead --prefer-online --fetch-retries=0 --fetch-timeout=10000); then
              if [ "$published" != "$GITHUB_SHA" ]; then
                echo "::error::Published gitHead does not match $GITHUB_SHA"
                exit 1
              fi
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              echo "Waiting for npm to expose $version ($attempt/30)"
              sleep 10
            fi
          done
          echo "::error::npm version $version is still unavailable after 30 checks"
          exit 1
